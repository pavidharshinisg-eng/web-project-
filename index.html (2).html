
<!DOCTYPE html>
<html>
<head>
    <title>College Navigation Bar</title>
<meta name="viewport"
          content="width=device-width, initial-scale=1.0">
<style>
body {
margin :0;
font-family :Arial,sans-serif;
}
nav {
background-color: lightblue;
padding: 15px;
}
.navbar{
display: flex;
justify-content: space-around;
align-items: center;
gap: 20px;
flex-wrap: wrap;
list-style: none;
margin: 0;
padding: 0;
}
.navbar a {
color: black;
text-decoration: none;
padding: 10px 15px;
display: block;
}
.navbar a:hover {
background-color: white;
color: black;
border-radius: 5px;
}
@media(max-width: 600px) {
.navbar{
flex-direction: column;
gap:5px;
}
.navbar a{
text-align: center;
}
}
</style>
</head>
 <body>

    <nav>
        <ul class="navbar">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Faculty</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>    

</html>
